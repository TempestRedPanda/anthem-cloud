    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://192.168.100.11:13306/anthem?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC
    username: redPanda
    password: RedPanda@1131
  data:
    redis:
      database: 0
      host: 192.168.100.12
      port: 16379
      password: Redis@0131
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 5000ms




#mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath:com/tempest/**/mapper/*Mapper.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.tempest.**.entity
  configuration:
   map-underscore-to-camel-case: true
   log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.security: trace
