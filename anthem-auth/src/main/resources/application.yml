server:
  port: 8081

spring:
  application:
    name: anthem-auth
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.100.13:18848
        username: nacos
        password: Nacos@1131
  datasource:
    hikari:
      pool-name: AnthemHikariCP
      minimum-idle: 10
